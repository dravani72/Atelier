<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atelier — Visual workspace</title><link rel="stylesheet" href="style.css"></head>
<body>
<div id="app">
 <aside id="sidebar"><div class="brand"><span class="brandmark">A</span><span>Atelier</span></div> <button id="search-open" class="search-button"><span data-icon="search"></span><span>Search</span><kbd>⌘ K</kbd></button>
 <div class="side-section"><span>Boards</span><button id="new-board" class="icon-button" title="New board" aria-label="New board"><span data-icon="plus"></span></button></div><nav id="boards"></nav>
 <button id="templates-open" class="side-action"><span data-icon="layout"></span>Templates</button>
 <div class="sidebar-bottom"><div class="private-badge"><span data-icon="lock"></span>Saved on this device</div><p>Your work, saved on this device.</p><div class="bottom-actions"><button id="settings-open" title="Settings" aria-label="Settings"><span data-icon="settings"></span></button><button id="help-open" title="Keyboard shortcuts" aria-label="Keyboard shortcuts"><span data-icon="help"></span></button></div></div>
 </aside>
 <main><header><div id="breadcrumbs"></div><div class="header-actions"><span id="save-status"><i></i> Saved</span><button id="export-open" class="button"><span data-icon="export"></span>Export</button></div></header>
 <section class="board-header"><div><div class="eyebrow">Board</div><h1 id="board-title" title="Double-click to rename"></h1><p id="board-description" title="Double-click to edit"></p></div><div class="board-actions"><button id="undo" class="icon-button" title="Undo (⌘Z)"><span data-icon="undo"></span></button><button id="redo" class="icon-button" title="Redo (⌘⇧Z)"><span data-icon="redo"></span></button><span class="divider"></span><button id="board-menu" class="icon-button" title="Board options"><span data-icon="more"></span></button></div></section>
 <section id="canvas" tabindex="0" aria-label="Visual board canvas"><div id="world"><svg id="edges"></svg><div id="cards"></div></div><div id="empty"><span data-icon="spark"></span><h2>Make room for a good idea.</h2><p>Add a note. Drop a reference. Start anywhere.</p><button class="button primary" id="first-note">Add your first note</button></div>
 <div id="tools" role="toolbar" aria-label="Add cards"></div><div class="canvas-bottom"><div class="canvas-hint"><span data-icon="move"></span><span>Space + drag to explore · Double-click to add a note</span></div><div class="zoom-controls"><button id="zoom-out" aria-label="Zoom out">−</button><button id="zoom-label" title="Reset zoom">100%</button><button id="zoom-in" aria-label="Zoom in">+</button><span></span><button id="fit" title="Fit board" aria-label="Fit board"><span data-icon="fit"></span></button></div></div>
 </section>
 </main><aside id="inspector" class="hidden"></aside>
</div><div id="toast" role="status"></div><dialog id="modal"></dialog><input type="file" id="media-input" hidden multiple accept=".mov,.avi,.mkv,.m4v,.fbx,.obj,.mtl,.usd,.usda,.usdt,.usdc,.usdz,image/png,image/jpeg,image/webp,image/gif,video/mp4,video/webm,video/ogg,application/pdf,text/plain"><input type="file" id="import-input" hidden accept=".json,application/json">
<script type="module" src="app.js"></script></body></html>
