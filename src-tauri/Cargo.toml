[package]
name = "atelier"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Offline visual workspace for creative projects"
license = "MIT"

[lib]
name = "atelier_core"
path = "src/lib.rs"

[[bin]]
name = "atelier"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:rfd", "dep:open", "dep:tauri-plugin-single-instance"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
url = "2"
base64 = "0.22"
tauri-plugin-single-instance = { version = "2", optional = true }
tauri = { package = "tauri", version = "2", optional = true , features = [] }
rfd = { version = "0.15", optional = true }
open = { version = "5", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dev-dependencies]
tempfile = "3"
